services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: breakfast
      POSTGRES_PASSWORD: breakfast_local
      POSTGRES_DB: breakfast
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - breakfast_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breakfast -d breakfast"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  breakfast_postgres:
